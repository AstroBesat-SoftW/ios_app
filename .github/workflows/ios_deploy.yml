name: iOS Build & TestFlight Upload

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Kodları çek
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable

      - name: Bağımlılıkları al
        run: flutter pub get

      - name: Eksik Uyumluluk (Null) Hatasını Önlemek İçin Info.plist Güncelle
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/Runner/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/Runner/Info.plist

      - name: Sertifikayı keychain'e aktar
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Provisioning profile indir
        id: provisioning
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ secrets.IOS_BUNDLE_ID }}
          profile-type: 'IOS_APP_STORE'
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Profil UUID'sini al ve ExportOptions.plist güncelle
        run: |
          PROFILE_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          UUID=$(basename "$PROFILE_PATH" .mobileprovision)
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          sed -i '' "s/PLACEHOLDER_PROFILE_UUID/$UUID/" ios/ExportOptions.plist

      - name: Xcode İmzalama Ayarlarını Kesin Olarak Manuel'e Çevir (Bulletproof)
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          gem install xcodeproj
          ruby -e "
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          uuid = ENV['PROFILE_UUID']
          team_id = ENV['TEAM_ID']
          
          # Otomatik imzalamayı kapat
          project.root_object.attributes['TargetAttributes'].each do |target, attributes|
            attributes['ProvisioningStyle'] = 'Manual'
          end
          
          # 1. Proje bazlı ayarları ez
          project.build_configurations.each do |config|
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = uuid
            config.build_settings['DEVELOPMENT_TEAM'] = team_id
          end
          
          # 2. HEDEF (Target) bazlı ayarları ez (Önceki hatayı çözen kısım burası)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
              config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = uuid
              config.build_settings['DEVELOPMENT_TEAM'] = team_id
            end
          end
          
          project.save
          "

      - name: Flutter ile IPA oluştur
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: IPA yolunu belirle
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: TestFlight'a yükle
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: ${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
