name: iOS TestFlight Deployment

on:
  push:
    branches:
      - main # Eğer GitHub'daki ana dalınızın adı master ise burayı master yapın.
  workflow_dispatch: # İŞTE BU SATIR SANA "RUN" BUTONUNU VERECEK!
  
jobs:
  build-and-deploy-ios:
    runs-on: macos-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v3

      - name: Flutter Ortamını Kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'

      - name: Apple Sertifikalarını Kur
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Kasayı oluştur ve varsayılan yap (EKSİK OLAN YETKİ BURADA VERİLDİ)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          # Sertifikayı içeri aktar
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          
          # EN ÖNEMLİ SATIR: Derleme işlemi için sertifika kasasına okuma izni (Partition) ver!
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Mac için Manuel İmzalama Ayarı (Windows Çözümü)
        run: |
          # Xcode'un inatla Development (Geliştirici) sertifikası aramasını engelleyip
          # bizim yüklediğimiz TestFlight (Distribution) profillerini kullanmasını zorluyoruz.
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: IPA Dosyasını Derle
        run: |
          flutter pub get
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: TestFlight'a Gönder
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun altool --upload-app -type ios -f build/ios/ipa/*.ipa --username "$APPLE_ID" --password "$APP_SPECIFIC_PASSWORD"
